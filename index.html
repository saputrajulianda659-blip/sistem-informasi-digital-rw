<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Informasi Pelayanan Digital RW</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito+Sans:ital,opsz,wght@0,6..12,300..900;1,6..12,300..900&display=swap"
        rel="stylesheet">
    <!-- Phosphor Icons (Local & CDN fallbacks) -->
    <link rel="stylesheet" href="css/phosphor/regular/style.css">
    <link rel="stylesheet" href="css/phosphor/bold/style.css">
    <link rel="stylesheet" href="css/phosphor/fill/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Immediate Theme Initialization (Prevents flash of light theme) -->
    <script>
        (function() {
            try {
                if (localStorage.getItem('digitalrw_theme') === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch(e) {}
        })();
    </script>
    <!-- SweetAlert2 (Custom Confirmation & Alerts) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <div id="app"></div>

    <!-- Register Component View -->
    <script src="js/views/Register.js"></script>

    <!-- Application Scripts (ES Modules) -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
